<h2>Listado de tareas</h2>
<h3>
  Tareas pendientes: {{ taskService.pendingTasks().length }} -
  Tareas completadas: {{ taskService.completedTasks() }}
</h3>

<app-task-form (taskCreatedEvent)="taskService.addTask($event)" />

@for (task of taskService.tasks(); track task.id) {
  <app-task-item
    [task]="task"
    (toggleEvent)="taskService.toggleTask($event)"
    (deleteEvent)="taskService.deleteTask($event)"
  />
} @empty {
  <p>No hay tareas disponibles.</p>
}
